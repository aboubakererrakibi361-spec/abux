<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محول العملات</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma, Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:400px;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    color:#2a5298;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    background:#2a5298;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1b3b73;
}

.result{
    margin-top:20px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    color:green;
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#666;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<h1>💱 محول العملات</h1>

<div class="input-group">
<label>المبلغ</label>
<input type="number" id="amount" value="1">
</div>

<div class="input-group">
<label>من</label>
<select id="from">
<option value="USD">دولار أمريكي USD</option>
<option value="EUR">يورو EUR</option>
<option value="GBP">جنيه إسترليني GBP</option>
<option value="SAR">ريال سعودي SAR</option>
<option value="AED">درهم إماراتي AED</option>
<option value="MAD">درهم مغربي MAD</option>
<option value="EGP">جنيه مصري EGP</option>
<option value="JPY">ين ياباني JPY</option>
<option value="CAD">دولار كندي CAD</option>
</select>
</div>

<div class="input-group">
<label>إلى</label>
<select id="to">
<option value="MAD">درهم مغربي MAD</option>
<option value="USD">دولار أمريكي USD</option>
<option value="EUR">يورو EUR</option>
<option value="GBP">جنيه إسترليني GBP</option>
<option value="SAR">ريال سعودي SAR</option>
<option value="AED">درهم إماراتي AED</option>
<option value="EGP">جنيه مصري EGP</option>
<option value="JPY">ين ياباني JPY</option>
<option value="CAD">دولار كندي CAD</option>
</select>
</div>

<button onclick="convertCurrency()">
تحويل
</button>

<div class="result" id="result">
النتيجة ستظهر هنا
</div>

<div class="footer">
تحديث مباشر لأسعار الصرف
</div>

</div>

<script>

async function convertCurrency(){

let amount=document.getElementById("amount").value;
let from=document.getElementById("from").value;
let to=document.getElementById("to").value;

if(amount=="" || amount<=0){
alert("أدخل مبلغاً صحيحاً");
return;
}

let url=`https://open.er-api.com/v6/latest/${from}`;

try{

let response=await fetch(url);
let data=await response.json();

let rate=data.rates[to];

let result=(amount*rate).toFixed(2);

document.getElementById("result").innerHTML=
`${amount} ${from} = <br><br> ${result} ${to}`;

}
catch(e){

document.getElementById("result").innerHTML=
"حدث خطأ أثناء جلب أسعار الصرف";

}

}

</script>

</body>
</html>
